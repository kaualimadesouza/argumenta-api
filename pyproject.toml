[project]
name = "argumenta-api"
version = "0.2.0"
description = "Argumenta API: argumentative writing training for vestibular prep"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "email-validator>=2.0",
    "anthropic>=0.40",
    "spylls>=0.1.7",
    "mangum>=0.22.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "boto3>=1.43.83",
]

[project.optional-dependencies]
openai = ["openai>=1.50"]
google = ["google-genai>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "pre-commit>=3.8",
    "openai>=1.50",
    "google-genai>=1.0",
    "boto3-stubs[lambda]>=1.43.83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/argumenta"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# alembic autogenerate emits long sa.Column(...) lines; not worth hand-wrapping
"migrations/versions/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "spylls.*"
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# the calibration run costs tokens and needs an API key: opt in with
# `-m calibration`, never blocking a normal PR (issue #12)
addopts = "-m 'not calibration'"
markers = [
    "calibration: runs the real evaluation engine against the annotated fixtures",
]

[tool.importlinter]
root_packages = ["argumenta"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain and application stay framework-free"
type = "forbidden"
source_modules = ["argumenta.domain", "argumenta.application"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "argumenta.adapters",
    "argumenta.presentation",
    "argumenta.entrypoints",
]

[[tool.importlinter.contracts]]
name = "domain does not depend on application"
type = "forbidden"
source_modules = ["argumenta.domain"]
forbidden_modules = ["argumenta.application"]
