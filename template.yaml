AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  argumenta-api
  FastAPI application using AWS Lambda and API Gateway.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        ENVIRONMENT: !Ref Stage

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  ArgumentaAnthropicApiKey:
    Type: String
    NoEcho: true
  ArgumentaGoogleClientId:
    Type: String
    NoEcho: true
  ArgumentaGoogleClientSecret:
    Type: String
    NoEcho: true
  ArgumentaDatabaseUrl:
    Type: String
    NoEcho: true
  ArgumentaAppSecret:
    Type: String
    NoEcho: true
  ImageUri:
    Type: String
    Description: Pre-built ECR image URI (tagged with the commit SHA); built and pushed by the pipeline's Build and Push job, not by sam build.

Resources:
  FastApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageUri: !Ref ImageUri
      Architectures:
        - x86_64
      Environment:
        Variables:
          ARGUMENTA_ANTHROPIC_API_KEY: !Ref ArgumentaAnthropicApiKey
          ARGUMENTA_GOOGLE_CLIENT_ID: !Ref ArgumentaGoogleClientId
          ARGUMENTA_GOOGLE_CLIENT_SECRET: !Ref ArgumentaGoogleClientSecret
          ARGUMENTA_DATABASE_URL: !Ref ArgumentaDatabaseUrl
          ARGUMENTA_APP_SECRET: !Ref ArgumentaAppSecret
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
