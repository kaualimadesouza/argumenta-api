name: Calibration

# Never on pull requests: this job spends LLM tokens. It runs when something
# that moves a score changes (prompt, LLM adapter, model or effort settings), on
# demand, and weekly as a floor so a silent model change still shows up (#12).
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # everything that moves a score: the prompt, the adapter that calls the
      # model, and the settings that pick the model and the thinking effort
      - "src/argumenta/adapters/llm/**"
      - "src/argumenta/settings.py"
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: calibration
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          uv venv --python=python3.12
          uv sync

      # no key, no measurement: a green skip would turn the weekly floor into
      # a job that reports success while measuring nothing
      - name: Require the API key
        env:
          ARGUMENTA_ANTHROPIC_API_KEY: ${{ secrets.ARGUMENTA_ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ARGUMENTA_ANTHROPIC_API_KEY" ]; then
            echo "secret ARGUMENTA_ANTHROPIC_API_KEY is not configured" >&2
            exit 1
          fi

      # -m overrides the addopts in pyproject, which deselects this suite by
      # default; -s keeps the report visible when the run passes
      - name: Run the calibration suite
        env:
          ARGUMENTA_ANTHROPIC_API_KEY: ${{ secrets.ARGUMENTA_ANTHROPIC_API_KEY }}
        run: |
          source .venv/bin/activate
          uv run --active pytest -m calibration -s
