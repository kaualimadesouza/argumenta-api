name: Deploy API

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - prod
  # release-please chains this workflow for the prod deploy: its release is
  # created with GITHUB_TOKEN, whose events never trigger other workflows
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

concurrency:
  group: deploy-api-${{ inputs.environment || (github.event_name == 'release' && 'prod') || 'dev' }}
  cancel-in-progress: false

env:
  ECR_REPOSITORY: argumenta-api
  ENV_NAME: ${{ inputs.environment || (github.event_name == 'release' && 'prod') || 'dev' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # pragma: allowlist secret
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # pragma: allowlist secret
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker buildx build --platform linux/amd64 --provenance=false \
            --push -t "$REGISTRY/$ECR_REPOSITORY:$TAG" .
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # the job-level environment key cannot read the env context, hence the
    # repeated expression; it selects which ARGUMENTA_DATABASE_URL* it gets
    environment: ${{ inputs.environment || (github.event_name == 'release' && 'prod') || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        run: pip install uv

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }} # pragma: allowlist secret
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # pragma: allowlist secret
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Run Migrations
        env:
          # direct (non-pooled) connection: pgbouncer transaction mode does not
          # support the session state Alembic's DDL relies on
          ARGUMENTA_DATABASE_URL: ${{ secrets.ARGUMENTA_DATABASE_URL_DIRECT }}
        run: |
          uv venv --python=3.12
          uv sync
          source .venv/bin/activate
          alembic upgrade head

      # idempotent per story (already-present stories are left untouched),
      # which is what lets it run on every deploy
      - name: Seed content
        env:
          ARGUMENTA_DATABASE_URL: ${{ secrets.ARGUMENTA_DATABASE_URL }}
        run: |
          source .venv/bin/activate
          python -m argumenta.entrypoints.seed_content

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infrastructure
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=argumenta-api/${ENV_NAME}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}"

      - name: Terraform apply
        working-directory: infrastructure
        env:
          TF_VAR_stage: ${{ env.ENV_NAME }}
          TF_VAR_image_uri: ${{ needs.build-and-push.outputs.image-uri }}
          TF_VAR_argumenta_anthropic_api_key: ${{ secrets.ARGUMENTA_ANTHROPIC_API_KEY }}
          TF_VAR_argumenta_google_client_id: ${{ secrets.ARGUMENTA_GOOGLE_CLIENT_ID }}
          TF_VAR_argumenta_google_client_secret: ${{ secrets.ARGUMENTA_GOOGLE_CLIENT_SECRET }}
          TF_VAR_argumenta_database_url: ${{ secrets.ARGUMENTA_DATABASE_URL }}
          TF_VAR_argumenta_jwt_secret: ${{ secrets.ARGUMENTA_JWT_SECRET }}
          TF_VAR_argumenta_google_api_key: ${{ secrets.ARGUMENTA_GOOGLE_API_KEY }}
          TF_VAR_argumenta_llm_vendor: ${{ vars.ARGUMENTA_LLM_VENDOR || 'anthropic' }}
          TF_VAR_argumenta_evaluation_model: ${{ vars.ARGUMENTA_EVALUATION_MODEL || 'claude-sonnet-5' }}
          TF_VAR_argumenta_reaction_model: ${{ vars.ARGUMENTA_REACTION_MODEL || 'claude-haiku-4-5' }}
        run: terraform apply -auto-approve -input=false

  notify:
    needs: [ci, build-and-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CI_RESULT: ${{ needs.ci.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ "$DEPLOY_RESULT" = "success" ]; then
            ICON="✅"
            STATUS_TEXT="concluido"
          elif [ "$CI_RESULT" != "success" ]; then
            ICON="❌"
            STATUS_TEXT="falhou no CI"
          elif [ "$BUILD_RESULT" != "success" ]; then
            ICON="❌"
            STATUS_TEXT="falhou ao construir/enviar a imagem"
          else
            ICON="❌"
            STATUS_TEXT="falhou no deploy"
          fi
          MESSAGE=$(printf '%s Deploy do argumenta-api (%s) %s\ncommit: %s\nrun: %s/%s/actions/runs/%s' \
            "$ICON" "$ENV_NAME" "$STATUS_TEXT" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
