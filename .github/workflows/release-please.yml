name: release-please
description: |
  Keeps a release PR open on main, built from conventional commits. Merging the
  release PR creates the semver tag, the GitHub Release, CHANGELOG.md and then
  chains the prod deploy: the release is created with GITHUB_TOKEN, so the
  `release: published` event never reaches other workflows on its own.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: python
          token: ${{ secrets.RP_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json

  deploy-prod:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    # same group as deploy.yml computes for prod, so the two paths serialize
    concurrency:
      group: deploy-api-prod
      cancel-in-progress: false
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
    secrets: inherit # pragma: allowlist secret
