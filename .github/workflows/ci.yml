name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: argumenta
          POSTGRES_PASSWORD: argumenta # pragma: allowlist secret (throwaway CI container)
          POSTGRES_DB: argumenta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argumenta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install uv
          uv venv --python=python3.12
          uv sync

      - name: Run pre-commit
        run: |
          source .venv/bin/activate
          pre-commit run --all-files

      - name: Migration roundtrip (upgrade, downgrade, upgrade)
        if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
        run: |
          source .venv/bin/activate
          uv run --active alembic upgrade head
          uv run --active alembic downgrade base
          uv run --active alembic upgrade head
          uv run --active alembic check

      - name: Run Pytest
        if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-please--')
        env:
          TERM: dumb
        run: |
          source .venv/bin/activate
          uv run --active pytest
