services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: argumenta
      POSTGRES_PASSWORD: argumenta
      POSTGRES_DB: argumenta
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argumenta"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ARGUMENTA_DATABASE_URL: postgresql+psycopg://argumenta:argumenta@db:5432/argumenta
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python, not curl: the slim image has none. urlopen raises on 503, so a
      # database the API cannot reach keeps the container unhealthy
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  pgdata:
